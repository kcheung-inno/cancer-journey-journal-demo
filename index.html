</div>

<div class="demobar"><b>示範版</b><span>僅含部分症狀與規則的體驗版；完整版為私有</span></div>

      回診摘要<small>一鍵給醫師</small>
    </button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="printRoot"></div>

<script>
(function () {
  var msgs = [], shown = false;
  function on(t, ty, fn) { if (t && typeof t.addEventListener === 'function') t.addEventListener(ty, fn); }
  function show() {
    var b = document.getElementById('bootDiag'); if (!b) return;
    b.hidden = false; document.getElementById('bootDiagBody').textContent = msgs.join(' ｜ '); shown = true;
  }
  on(window, 'error', function (e) { msgs.push('錯誤：' + (e.message || '未知') + ' @' + (e.lineno || 0)); show(); });
  on(window, 'unhandledrejection', function (e) { msgs.push('未處理：' + ((e.reason && e.reason.message) || e.reason)); show(); });
  on(window, 'load', function () {
    setTimeout(function () {
      if (shown) return;
      var miss = [];
      if (!window.CJJ_LEX) miss.push('詞庫未載入');
      if (!window.CJJ_APP) miss.push('介面未載入');
      if (!miss.length) return;
      msgs.push('啟動檢查失敗：' + miss.join('、'));
      show();
    }, 5000);
  });
})();
</script>
